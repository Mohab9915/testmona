server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed asset filenames, so a given URL's bytes never
    # change. Cache them hard: repeat visitors re-download nothing, which matters
    # on a metered host (GCP's free tier allows 1 GB egress/month).
    location /assets/ {
        # add_header only (no `expires`), which would emit a second, competing
        # Cache-Control header.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the pointer to those hashed files and must never be cached,
    # or a deploy leaves browsers requesting chunk names that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compress on the way out. Everything here is text; the hashed assets above
    # are served from disk uncompressed otherwise.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI calls and tracker syncs are slow; the default 60s cuts them off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
